

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Springboot_02'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Swagger UI + OpenAPI docs generated from your controllers, like Swashbuckle in ASP.NET.
    // After starting the app open http://localhost:8080/swagger-ui.html
    // (raw OpenAPI JSON: http://localhost:8080/v3/api-docs).
    // Spring Boot 4 needs springdoc-openapi 3.x; 2.x is for Spring Boot 3 and will not work.
    // Unlike the other libraries here, Spring Boot does not manage this one, so it has a version.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'


    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    implementation 'org.hibernate.orm:hibernate-community-dialects'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // H2 is now used ONLY by tests (see src/test/resources/application-test.properties),
    // so `gradlew test` works even when XAMPP is switched off.
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

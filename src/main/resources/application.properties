# application.properties = Spring's appsettings.json.
# Each line is key=value. Spring Boot reads it at startup, and every library
# (web server, database, logging...) looks here for its settings.
# Full list of keys: https://docs.spring.io/spring-boot/appendix/application-properties/

# The app's name, shown in every log line as [Springboot_02].
spring.application.name=Springboot_02

# Port for the embedded Tomcat server. 8080 is already the default;
# change it here if another app is using 8080 (for example server.port=8081).
server.port=8080

# Logging levels, like "Logging:LogLevel" in appsettings.json.
# DEBUG for Spring's web layer prints each incoming request and which
# controller method handled it, so you can watch requests in the console.
logging.level.org.springframework.web=DEBUG

# Your own settings can live here too. The "app." prefix is just a naming
# convention so they don't clash with Spring's keys. Step 5 reads this one
# in HelloController, like reading IConfiguration["App:WelcomeMessage"].
app.welcome-message=Welcome to my Spring Boot app!

# ---------- Database: XAMPP MySQL/MariaDB ----------
# Like a connection string in appsettings.json.
# Start the MySQL module in the XAMPP Control Panel BEFORE running the app.
# createDatabaseIfNotExist=true makes the driver create the "shop" database if it is missing.
# For Vietnamese text (diacritics) it is better to create it yourself ONCE in DBeaver with
# utf8mb4, because an auto-created database uses the server's default character set:
#   CREATE DATABASE shop CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=jdbc:mariadb://localhost:3306/shop?createDatabaseIfNotExist=true
# XAMPP default: user root with an EMPTY password. Change both if you set a password.
spring.datasource.username=root
spring.datasource.password=

# What Hibernate does with the tables at startup.
#   update = create missing tables/columns from your entity classes and KEEP the data
#            (fine for learning; real projects use migrations like Flyway, similar to EF migrations).
# Use create-drop instead if you want a clean database on every start.
spring.jpa.hibernate.ddl-auto=update

# The "dialect" tells Hibernate how to write SQL for your database (like choosing the EF Core provider).
# XAMPP's MariaDB is 10.4, which Hibernate 7's normal MariaDBDialect no longer supports: its
# "alter table if exists ... add constraint" statements are rejected, so the FOREIGN KEYS were never
# created and the database would not stop you deleting a product that is still in an order.
# The legacy dialect (from hibernate-community-dialects in build.gradle) writes SQL that 10.4 accepts.
# If you upgrade to MariaDB 10.6 or newer you can delete this line and the dependency.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.MariaDBLegacyDialect

# Print the SQL that Hibernate runs, nicely formatted, so you can see it work.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# By default Spring keeps the database session open while the JSON is being written
# ("open-in-view"), which hides lazy-loading mistakes and holds connections longer.
# Turning it off is the recommended setting: all database work happens inside the
# service classes, and controllers only receive plain DTO objects.
spring.jpa.open-in-view=false

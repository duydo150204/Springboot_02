# Extra settings used only when the "test" profile is active (@ActiveProfiles("test")).
# They are layered on top of application.properties, like appsettings.Testing.json.
# Tests use an in-memory H2 database so they don't need XAMPP running
# and never touch your real "shop" data.
spring.datasource.url=jdbc:h2:mem:shop_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# application.properties selects the MariaDB legacy dialect; H2 needs its own, so override it here.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
